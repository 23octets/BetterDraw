name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Vérifications
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Valider les configurations Cloudflare (sans déployer)
        run: npm run check:cloudflare
      - run: npm run size

  e2e:
    name: E2E
    # version fixée : les captures de référence dépendent du système et de ses polices
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lire la version de Playwright
        id: playwright
        run: echo "version=$(npx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: Restaurer les navigateurs
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Installer Chromium et ses dépendances
        if: steps.browsers.outputs.cache-hit != 'true'
        timeout-minutes: 12
        run: bash .github/scripts/with-apt-retry.sh npx playwright install --with-deps chromium
      - name: Installer les dépendances système
        if: steps.browsers.outputs.cache-hit == 'true'
        timeout-minutes: 12
        run: bash .github/scripts/with-apt-retry.sh npx playwright install-deps chromium
      # dev, main et la merge queue passent la suite complète ; les autres bases gardent le socle @essentiel
      - name: Tests E2E
        run: npm run ${{ github.event_name == 'pull_request' && github.base_ref != 'main' && github.base_ref != 'dev' && 'test:e2e:essentiel' || 'test:e2e' }}
      - name: Publier le rapport Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            e2e/__screenshots__/
          retention-days: 14
          if-no-files-found: ignore

  promotion:
    name: ${{ (github.event_name == 'merge_group' || github.base_ref == 'main') && 'Branche de promotion' || 'Branche de promotion (hors promotion)' }}
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          test "$HEAD_BRANCH" = dev
          test "$HEAD_REPOSITORY" = "$GITHUB_REPOSITORY"

  recette:
    name: ${{ (github.event_name == 'merge_group' || github.base_ref == 'main') && 'Recette' || 'Recette (hors promotion)' }}
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    needs: [checks, e2e, promotion]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: recette
      url: https://dev.betterdraw.yohan.one
    steps:
      - name: Recette approuvée pour cette révision
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: echo "Recette approuvée pour $HEAD_SHA"
