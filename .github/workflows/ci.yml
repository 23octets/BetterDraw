name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Vérifications
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Valider les configurations Cloudflare (sans déployer)
        run: npm run check:cloudflare
      - run: npm run size

  playwright:
    name: Version de Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: package-lock.json
          sparse-checkout-cone-mode: false
      - id: version
        run: echo "version=$(jq -r '.packages["node_modules/@playwright/test"].version' package-lock.json)" >> "$GITHUB_OUTPUT"

  e2e:
    name: E2E
    needs: playwright
    runs-on: ubuntu-24.04
    # image officielle : Chromium et ses dépendances sont déjà installés, aucun apt à chaque run.
    # Les captures de référence dépendent de cette image ; elle suit la version de Playwright du lockfile.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-noble
      options: --user 1001 --ipc=host
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # seuls les pushes sur dev passent la suite complète ; PR et merge queue gardent le socle @essentiel
      - name: Choisir les polices du rendu
        run: mkdir -p ~/.config/fontconfig && cp .github/fontconfig/fonts.conf ~/.config/fontconfig/
      - name: Tests E2E
        run: npm run ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' && 'test:e2e' || 'test:e2e:essentiel' }}
      - name: Publier le rapport Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            e2e/__screenshots__/
          retention-days: 14
          if-no-files-found: ignore
