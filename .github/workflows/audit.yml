# Non obligatoire pour fusionner : une faille publiée dans une dépendance ne doit pas bloquer une PR sans rapport.
name: Audit

on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/audit.yml
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit des dépendances
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm audit --omit=dev --audit-level=high
