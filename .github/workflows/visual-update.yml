# Régénère les images de référence sur le même runner que la CI et les publie en artefact.
name: Mettre à jour les captures

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    name: Captures de référence
    runs-on: ubuntu-24.04
    # même image que le job E2E de la CI : mettre la version à jour avec @playwright/test
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --user 1001 --ipc=host
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Choisir les polices du rendu
        run: mkdir -p ~/.config/fontconfig && cp .github/fontconfig/fonts.conf ~/.config/fontconfig/
      - run: npx playwright test e2e/visual.spec.ts --update-snapshots=all
      - uses: actions/upload-artifact@v7
        with:
          name: captures
          path: e2e/__screenshots__/
          retention-days: 7
